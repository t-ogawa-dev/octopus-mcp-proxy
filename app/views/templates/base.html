<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Octopus MCP Proxy{% endblock %}</title>
    
    <!-- Favicons -->
    <link rel="icon" href="/assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    
    <link rel="stylesheet" href="/assets/style.css">
    <script src="/assets/i18n.js"></script>
    <script src="/assets/js/api-client.js"></script>
    <script src="/assets/js/dom.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="header">
        <h1 class="brand-title">
            <a href="/dashboard" class="brand-link">
                <img src="/assets/header-logo.png" alt="" class="header-logo">
                <span>Octopus MCP Proxy</span>
            </a>
        </h1>
        <div class="header-actions">
            <a href="/logout" class="btn btn-danger" data-i18n="logout">ログアウト</a>
        </div>
    </div>
    
    <div class="container">
        {% block breadcrumb %}{% endblock %}
        
        {% block content %}{% endblock %}
    </div>
    
    <footer class="app-footer">
        <a href="https://github.com/t-ogawa-dev/octopus-mcp-proxy" target="_blank" rel="noopener">GitHub</a>
        ·
        <a href="/guide" data-i18n="guide_footer_link">接続ガイド</a>
        ·
        <a href="/change-credentials" data-i18n="footer_change_credentials">資格情報の変更</a>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Common Modal (must be after Bootstrap) -->
    </footer>
    
    <script src="/assets/view/common/modal.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
